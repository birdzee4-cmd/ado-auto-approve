<!doctype html>
<html lang="th">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Deployment Analytics - Buzzebees</title>
  <link rel="icon" type="image/png" href="/assets/buzzebees-icon.png" />
  <link rel="stylesheet" href="/core.css" />
  <link rel="stylesheet" href="/deployment-analytics.css" />
</head>
<body>
  <nav class="navbar"><div class="nav-left"><img src="/assets/buzzebees-icon.png" alt="BUZZEBEES" class="nav-icon" /><span class="brand">Deployment Analytics</span><a class="nav-link" href="/deployment.html">Deployment / Monitor เดิม</a></div><div class="nav-right"><span id="userName" class="user-name">Loading...</span><a href="/.auth/logout?post_logout_redirect_uri=/" class="logout-button">Logout</a><img src="/assets/buzzebees-powered.png" alt="Powered by BUZZEBEES" class="nav-logo" /></div></nav>
  <main class="analytics-shell">
    <header class="analytics-header"><div><p class="eyebrow">Read-only delivery intelligence</p><h1>Deployment Analytics</h1><p>ภาพรวม Pipeline, Deployment Events และประสิทธิภาพจากข้อมูลที่ระบบอ่านได้</p></div><div class="header-actions"><span id="freshness" class="freshness">กำลังโหลดข้อมูล...</span><button id="refresh" class="primary-button" type="button">Refresh</button></div></header>
    <section class="filters" aria-label="ตัวกรอง"><label>ช่วงเวลา<select id="range"><option value="today">วันนี้</option><option value="7">7 วันที่ผ่านมา</option><option value="30" selected>30 วันที่ผ่านมา</option></select></label><label>Environment<select id="environment"><option value="">ทั้งหมด</option><option>Development</option><option>Staging</option><option>Production</option><option>Other</option></select></label><label>Result<select id="result"><option value="">ทั้งหมด</option><option value="succeeded">สำเร็จ</option><option value="failed">ล้มเหลว</option><option value="canceled">ยกเลิก</option></select></label></section>
    <section class="kpis" id="kpis"></section>
    <nav class="analytics-tabs" aria-label="มุมมอง"><button class="active" data-view="overview">Overview</button><button data-view="health">Pipeline Health</button><button data-view="events">Deployment Events</button><button data-view="analytics">Build Analytics</button><button data-view="performance">Performance</button></nav>
    <section id="view-overview" class="view active"></section><section id="view-health" class="view"></section><section id="view-events" class="view"></section><section id="view-analytics" class="view"></section><section id="view-performance" class="view"></section>
  </main>
  <script type="module" src="/deployment-analytics.js"></script>
  <dialog id="pipelineDetail" class="pipeline-detail"><button id="closePipelineDetail" class="secondary-button" type="button">ปิด</button><div id="pipelineDetailBody"></div></dialog>
</body>
</html>
