<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="icon" type="image/png" href="/assets/buzzebees-icon.png" />
  <title>Deployment Report - Buzzebees Internal Tools</title>
  <link rel="stylesheet" href="/core.css" />
  <link rel="stylesheet" href="/deployment.css?v=service-hook-v1" />
</head>
<body>
  <nav class="navbar"><div class="nav-left"><img src="/assets/buzzebees-icon.png" alt="BUZZEBEES" class="nav-icon" /><span class="brand">Deployment Report</span><div class="nav-links"><a href="/deployment.html" class="nav-link nav-link-active">Deployment</a></div></div><div class="nav-right"><span id="userName" class="user-name">Loading...</span><a href="/.auth/logout?post_logout_redirect_uri=/" class="logout-button">Logout</a><img src="/assets/buzzebees-powered.png" alt="Powered by BUZZEBEES" class="nav-logo" /></div></nav>
  <main class="deployment-page halftone-bg">
    <section class="deployment-content"><section class="deployment-view active" id="view-events"><div class="deployment-heading"><div><p class="deployment-kicker">Azure DevOps Service Hooks</p><h1>Deployment Events</h1><p id="eventsUpdated" class="heading-help">Loading hook events...</p></div><button class="primary-button" id="refreshEvents" type="button">Refresh</button></div><div class="deployment-card dashboard-filters event-filters"><label>Environment<select id="eventEnvironment"><option value="">All environments</option><option>Development</option><option>Staging</option><option>Production</option><option>Other</option></select></label><label>History<select id="eventRange"><option value="all">All history</option><option value="30">Last 30 days</option><option value="7">Last 7 days</option></select></label><label>Result<select id="eventResult"><option value="">All results</option><option value="succeeded">Succeeded</option><option value="failed">Failed</option><option value="canceled">Canceled</option></select></label><label>From date<input id="eventFrom" type="date" /></label><label>To date<input id="eventTo" type="date" /></label></div><div class="deployment-card table-wrap"><table class="records-table event-table"><thead><tr><th>Environment</th><th>Received</th><th>Pipeline / Run</th><th>Source</th><th>Stage</th><th>Result</th><th>Pull Request</th><th>Operator</th><th>Details</th></tr></thead><tbody id="eventBody"><tr><td colspan="9">Loading...</td></tr></tbody></table></div></section></section>
  </main>
  <dialog id="eventDetail" class="event-detail"><button id="closeEventDetail" class="detail-close" type="button">×</button><div id="eventDetailBody"></div></dialog>
  <script type="module" src="/deployment.js?v=service-hook-v1"></script>
</body>
</html>
